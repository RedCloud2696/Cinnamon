<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>留言区 · 红云irch的肉桂卷</title>
  <link rel="icon" href="素材/索琳肉桂卷.png">
  <link rel="stylesheet" href="style.css">
  <style>
    .comments-page {
      max-width: 760px;
      margin: 0 auto;
      padding: 40px 20px 64px;
    }

    /* 背景图 + 暖色柔光，和主页同一套观感 */
    body {
      min-height: 100vh;
      background:
        linear-gradient(rgba(255, 251, 247, .18), rgba(255, 251, 247, .46)),
        url('images/索琳.png') center / cover no-repeat fixed;
    }

    /* 返回：胶囊按钮 */
    .comments-page .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 22px;
      padding: 8px 16px;
      font-size: .85rem;
      color: var(--heading);
      background: rgba(255, 251, 247, .82);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-glass);
      border-radius: var(--r-full);
      box-shadow: var(--shadow-sm);
      transition: color .25s var(--ease),
                  transform .2s var(--ease),
                  box-shadow .25s var(--ease);
    }

    .comments-page .back-link:hover {
      color: var(--accent-700);
      transform: translateX(-2px);
      box-shadow: var(--shadow-md);
    }

    /* 说明卡片 */
    .comments-info {
      padding: 26px 30px;
      margin-bottom: 30px;
      font-size: .9rem;
      line-height: 1.85;
      color: #6E5B5B;
      border-radius: var(--r-lg);
      border: 1px solid var(--border-glass);
      box-shadow: var(--shadow-md);
      background:
        linear-gradient(rgba(255, 249, 247, .94), rgba(255, 244, 242, .94)),
        url('素材/索琳营帐.png') center / cover no-repeat;
    }

    .comments-info strong {
      color: var(--heading);
      font-weight: 700;
    }

    .comments-info a {
      color: var(--accent-800);
      font-weight: 500;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
      transition: color .25s var(--ease);
    }

    .comments-info a:hover { color: var(--accent-900); }

    /* giscus 容器 */
    .comments-page .giscus {
      padding: 1rem;
      overflow: hidden;
      background: rgba(255, 251, 247, .90);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-md);
    }
  </style>
</head>
<body>

  <div class="comments-page">
    <a href="index.html" class="back-link">← 返回笔记</a>

    <div class="comments-info">
      <!-- 个人账户信息 —— 在这里自由修改 -->
      <p>这里归 <strong>红云irch</strong> 所有。
        <br><a href="https://www.cc98.org/topic/6553150" target="_blank">点击传送我的一路楼，欢迎来玩喵~</a>
      </p>
      <p>有关笔记内容的问题、勘误、建议，或者只是想打个招呼，都可以在下面留言。</p>
<!-- 可以继续加邮箱、B站、其他链接等 -->
    </div>

    <!-- giscus 留言区 -->
    <script src="https://giscus.app/client.js"
      data-repo="RedCloud2696/Cinnamon"
      data-repo-id="R_kgDOTIYS7Q"
      data-category="General"
      data-category-id="DIC_kwDOTIYS7c4DAQEj"
      data-mapping="pathname"
      data-strict="0"
      data-reactions-enabled="1"
      data-emit-metadata="0"
      data-input-position="bottom"
      data-theme="preferred_color_scheme"
      data-lang="zh-CN"
      crossorigin="anonymous"
      async>
    </script>
  </div>

</body>
</html>
