<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学期回顾 · 红云irch的肉桂卷</title>
  <link rel="icon" href="素材/索琳肉桂卷.png">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #FFFBF7 url('images/索琳.png') no-repeat center/cover fixed;
    }
    .review-page {
      max-width: 680px;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }
    .review-page .back-link {
      display: inline-block;
      margin-bottom: 24px;
      font-size: .9rem;
      color: #B0A0A0;
      text-decoration: none;
    }
    .review-page .back-link:hover { color: var(--accent); }

    .review-search-wrap {
      margin-bottom: 20px;
    }
    .review-search-wrap input {
      width: 100%;
      padding: 10px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: .9rem;
      font-family: var(--font);
      background: rgba(255,255,255,.8);
      color: var(--text);
      outline: none;
      transition: border-color .2s;
    }
    .review-search-wrap input:focus { border-color: var(--accent); }

    .semester-section { margin-bottom: 24px; }

    .semester-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--heading);
      cursor: pointer;
      user-select: none;
      padding: 10px 16px;
      background: rgba(255, 251, 247, 0.98);
      border-radius: 8px;
      border-bottom: 2px solid var(--accent);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .semester-arrow {
      font-size: .8rem;
      color: var(--accent);
    }
    .semester-count {
      font-size: .75rem;
      color: #B0A0A0;
      font-weight: 400;
      margin-left: auto;
    }

    .course-card {
      background: rgba(255, 251, 247, 0.98);
      border-radius: 10px;
      padding: 18px 22px;
      margin-bottom: 14px;
      border-left: 3px solid var(--accent);
    }

    .course-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--heading);
      margin-bottom: 6px;
    }

    .course-gpa {
      display: inline-block;
      font-size: .85rem;
      color: #C0B0B0;
      cursor: pointer;
      user-select: none;
      transition: color .2s;
    }
    .course-gpa:hover { color: var(--accent); }
    .course-gpa.revealed { color: var(--accent); font-weight: 600; }

    .course-review {
      margin-top: 10px;
      font-size: .9rem;
      color: #8B7B7B;
      line-height: 1.8;
    }
    .course-review p { margin-bottom: 6px; }

    .review-empty {
      text-align: center;
      color: #C0B0B0;
      padding: 60px 20px;
    }
  </style>
</head>
<body>

  <div class="review-page">
    <a href="index.html" class="back-link">← 返回笔记</a>

    <div class="review-search-wrap">
      <input type="text" id="reviewSearch" placeholder="搜索课程…" autocomplete="off">
    </div>

    <div id="reviewContent">
      <div class="review-empty">加载中…</div>
    </div>
  </div>

  <script>
    ;(function () {
      const container = document.getElementById('reviewContent')
      const searchEl  = document.getElementById('reviewSearch')

      // 学期文件列表（按倒序排列，最新学期在前面）
      const SEMESTER_FILES = ['大一上.json', '大一下.json', '大二上.json', '大二下.json', '大三上.json', '大三下.json', '大四上.json', '大四下.json']

      let allData = []  // 所有学期数据

      async function load () {
        for (const file of SEMESTER_FILES) {
          try {
            const res = await fetch('review/' + file)
            if (!res.ok) continue
            const data = await res.json()
            allData.push(data)
          } catch (_) {}
        }
        if (!allData.length) {
          container.innerHTML = '<div class="review-empty">暂无学期回顾</div>'
          return
        }
        render()
        bindEvents()
      }

      function render (query) {
        query = (query || '').trim().toLowerCase()
        let html = ''
        for (const data of allData) {
          const filtered = query
            ? data.courses.filter(c => c.name.toLowerCase().includes(query) ||
                c.review.some(r => r.toLowerCase().includes(query)))
            : data.courses
          if (!filtered.length && query) continue

          let cards = ''
          for (const c of filtered) {
            let reviewHtml = ''
            for (const r of c.review) {
              reviewHtml += '<p>' + escapeHtml(r) + '</p>'
            }
            cards += `
              <div class="course-card">
                <div class="course-name">${escapeHtml(c.name)}</div>
                <span class="course-gpa" data-gpa="${escapeHtml(c.gpa)}">**/5.0</span>
                <div class="course-review">${reviewHtml}</div>
              </div>`
          }
          html += `
            <div class="semester-section">
              <div class="semester-title" data-semester="${escapeHtml(data.semester)}">
                <span class="semester-arrow">▾</span> ${escapeHtml(data.semester)}
                <span class="semester-count">${filtered.length} 门</span>
              </div>
              <div class="semester-body">${cards}</div>
            </div>`
        }
        container.innerHTML = html || '<div class="review-empty">没有匹配的课程</div>'
      }

      function bindEvents () {
        // 学期折叠
        container.querySelectorAll('.semester-title').forEach(el => {
          el.addEventListener('click', function () {
            const body = this.nextElementSibling
            const arrow = this.querySelector('.semester-arrow')
            const isOpen = body.style.display !== 'none'
            body.style.display = isOpen ? 'none' : ''
            arrow.textContent = isOpen ? '▸' : '▾'
          })
        })

        // 绩点点击
        container.querySelectorAll('.course-gpa').forEach(el => {
          el.addEventListener('click', function (e) {
            e.stopPropagation()
            const isRevealed = this.classList.contains('revealed')
            if (isRevealed) {
              this.classList.remove('revealed')
              this.textContent = '**/5.0'
            } else {
              this.classList.add('revealed')
              this.textContent = this.dataset.gpa
            }
          })
        })
      }

      // 搜索
      let searchTimer = null
      searchEl.addEventListener('input', function () {
        clearTimeout(searchTimer)
        searchTimer = setTimeout(() => {
          render(this.value)
          bindEvents()
        }, 200)
      })

      function escapeHtml (str) {
        const div = document.createElement('div')
        div.textContent = str
        return div.innerHTML
      }

      load()
    })()
  </script>

</body>
</html>
