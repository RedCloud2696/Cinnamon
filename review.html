<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学期回顾 · 红云irch的肉桂卷</title>
  <link rel="icon" href="素材/索琳肉桂卷.png">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #FFFBF7 url('images/索琳.png') no-repeat center/cover fixed;
      overflow-y: scroll;
    }
    .review-page {
      max-width: 680px;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }
    .review-page .back-link {
      display: inline-block;
      margin-bottom: 24px;
      font-size: .9rem;
      color: #B0A0A0;
      text-decoration: none;
    }
    .review-page .back-link:hover { color: var(--accent); }

    .review-search-wrap {
      margin-bottom: 20px;
    }
    .review-search-wrap input {
      width: 100%;
      padding: 10px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: .9rem;
      font-family: var(--font);
      background: rgba(255,255,255,.8);
      color: var(--text);
      outline: none;
      transition: border-color .2s;
    }
    .review-search-wrap input:focus { border-color: var(--accent); }

    .semester-section { margin-bottom: 24px; }

    .semester-body {
      overflow: hidden;
      max-height: 5000px;
      transition: max-height .4s ease, opacity .3s ease;
      opacity: 1;
    }
    .semester-body.collapsed {
      max-height: 0;
      opacity: 0;
    }

    .semester-body-inner {
      background: rgba(255, 251, 247, 0.98);
      border-radius: 10px;
      padding: 20px 22px;
    }

    .semester-intro {
      font-size: .9rem;
      color: #8B7B7B;
      line-height: 1.8;
      padding-bottom: 14px;
      margin-bottom: 14px;
      border-bottom: 1px dashed var(--border);
    }

    .semester-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--heading);
      cursor: pointer;
      user-select: none;
      padding: 10px 16px;
      background: rgba(255, 251, 247, 0.98);
      border-radius: 8px;
      border-bottom: 2px solid var(--accent);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .semester-arrow {
      font-size: .8rem;
      color: var(--accent);
    }
    .semester-count {
      font-size: .75rem;
      color: #B0A0A0;
      font-weight: 400;
      margin-left: auto;
    }

    .course-card {
      padding: 12px 0;
      margin-bottom: 4px;
      border-bottom: 1px solid var(--border);
    }
    .course-card:last-child { border-bottom: none; }

    .course-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--heading);
      margin-bottom: 6px;
    }

    .course-gpa {
      display: inline-block;
      font-size: .85rem;
      color: #C0B0B0;
      cursor: pointer;
      user-select: none;
      transition: color .2s;
    }
    .course-gpa:hover { color: var(--accent); }
    .course-gpa.revealed { color: var(--accent); font-weight: 600; }
    .course-gpa.no-gpa { cursor: default; color: #D0C0C0; }
    .course-credit { font-size: .8rem; color: #C0B0B0; }
    .course-teacher {
      font-size: .75rem;
      color: #B0A0A0;
      margin-left: 6px;
    }
    .course-teacher::before { content: '· '; }
    .course-score { font-size: .8rem; color: #C0B0B0; }
    .course-code {
      display: block;
      font-size: .7rem;
      color: #D0C0C0;
      margin-top: 2px;
    }
    .review-tag {
      display: inline-block;
      min-width: 32px;
      padding: 1px 8px;
      border-radius: 4px;
      font-size: .75rem;
      font-weight: 700;
      margin-right: 6px;
      text-align: center;
    }
    .review-tag.pros { background: #F0FFF0; color: #6B8B6B; border: 1px solid #D0E8D0; }
    .review-tag.cons { background: #FFF0F0; color: #C08080; border: 1px solid #F0D0D0; }
    .review-pros, .review-cons { margin-top: 4px; font-size: .85rem; }

    .course-review {
      margin-top: 10px;
      font-size: .9rem;
      color: #8B7B7B;
      line-height: 1.8;
    }
    .course-review p { margin-bottom: 6px; }

    .review-empty {
      text-align: center;
      color: #C0B0B0;
      padding: 60px 20px;
    }
  </style>
</head>
<body>

  <div class="review-page">
    <a href="index.html" class="back-link">← 返回笔记</a>

    <div class="review-search-wrap">
      <input type="text" id="reviewSearch" placeholder="搜索课程…" autocomplete="off">
    </div>

    <div id="reviewContent">
      <div class="review-empty">加载中…</div>
    </div>
  </div>

  <script>
    ;(function () {
      const container = document.getElementById('reviewContent')
      const searchEl  = document.getElementById('reviewSearch')

      // 学期文件列表（按倒序排列，最新学期在前面）
      const SEMESTER_FILES = ['大一上.json', '大一下.json', '大二上.json', '大二下.json', '大三上.json', '大三下.json', '大四上.json', '大四下.json']

      let allData = []  // 所有学期数据

      async function load () {
        for (const file of SEMESTER_FILES) {
          try {
            const res = await fetch('review/' + file)
            if (!res.ok) continue
            const data = await res.json()
            allData.push(data)
          } catch (_) {}
        }
        if (!allData.length) {
          container.innerHTML = '<div class="review-empty">暂无学期回顾</div>'
          return
        }
        render()
        bindEvents()
      }

      function render (query) {
        query = (query || '').trim().toLowerCase()
        let html = ''
        for (const data of allData) {
          const filtered = query
            ? data.courses.filter(c => c.name.toLowerCase().includes(query) ||
                c.review.some(r => r.toLowerCase().includes(query)))
            : data.courses
          if (!filtered.length && query) continue

          // 按绩点降序，null 排最后
          const sorted = [...filtered].sort((a, b) => {
            const ga = a.gpa ? parseFloat(a.gpa) : -1
            const gb = b.gpa ? parseFloat(b.gpa) : -1
            return gb - ga
          })

          let cards = ''
          for (const c of sorted) {
            const rev = c.review || {}
            // 兼容旧格式（数组）和新格式（对象）
            let reviewHtml = ''
            if (Array.isArray(rev)) {
              for (const r of rev) reviewHtml += '<p>' + escapeHtml(r) + '</p>'
            } else {
              if (rev.overview) reviewHtml += '<p>' + escapeHtml(rev.overview) + '</p>'
              if (rev.pros) reviewHtml += '<p class="review-pros"><span class="review-tag pros">优点</span>' + escapeHtml(rev.pros) + '</p>'
              if (rev.cons) reviewHtml += '<p class="review-cons"><span class="review-tag cons">缺点</span>' + escapeHtml(rev.cons) + '</p>'
            }
            const teacherHtml = c.teacher ? `<span class="course-teacher">${escapeHtml(c.teacher)}</span>` : ''
            cards += `
              <div class="course-card">
                <div class="course-name">${escapeHtml(c.name)}${teacherHtml}</div>
                <span class="course-gpa${c.gpa ? '' : ' no-gpa'}" data-gpa="${escapeHtml(c.gpa || '')}">${c.gpa ? '**/5.0' : '--/5.0'}</span>${c.credit ? `<span class="course-credit"> · ${escapeHtml(c.credit)} 学分</span>` : ''}${c.code ? `<span class="course-code">${escapeHtml(c.code)}</span>` : ''}
                <div class="course-review">${reviewHtml}</div>
              </div>`
          }
          const introHtml = data.intro ? `<div class="semester-intro">${escapeHtml(data.intro)}</div>` : ''
          html += `
            <div class="semester-section">
              <div class="semester-title" data-semester="${escapeHtml(data.semester)}">
                <span class="semester-arrow">▸</span> ${escapeHtml(data.semester)}
                <span class="semester-count">${filtered.length} 门</span>
              </div>
              <div class="semester-body collapsed"><div class="semester-body-inner">${introHtml}${cards}</div></div>
            </div>`
        }
        container.innerHTML = html || '<div class="review-empty">没有匹配的课程</div>'
      }

      function bindEvents () {
        // 学期折叠
        container.querySelectorAll('.semester-title').forEach(el => {
          el.addEventListener('click', function () {
            const body = this.nextElementSibling
            const arrow = this.querySelector('.semester-arrow')
            const isOpen = !body.classList.contains('collapsed')
            if (isOpen) {
              body.classList.add('collapsed')
              arrow.textContent = '▸'
            } else {
              body.classList.remove('collapsed')
              arrow.textContent = '▾'
            }
          })
        })

        // 绩点点击
        container.querySelectorAll('.course-gpa').forEach(el => {
          el.addEventListener('click', function (e) {
            e.stopPropagation()
            if (this.classList.contains('no-gpa')) return  // 没出分不响应点击
            const isRevealed = this.classList.contains('revealed')
            if (isRevealed) {
              this.classList.remove('revealed')
              this.textContent = '**/5.0'
            } else {
              this.classList.add('revealed')
              this.textContent = this.dataset.gpa
            }
          })
        })
      }

      // 搜索
      let searchTimer = null
      searchEl.addEventListener('input', function () {
        clearTimeout(searchTimer)
        searchTimer = setTimeout(() => {
          render(this.value)
          bindEvents()
        }, 200)
      })

      function escapeHtml (str) {
        const div = document.createElement('div')
        div.textContent = str
        return div.innerHTML
      }

      load()
    })()
  </script>

</body>
</html>
